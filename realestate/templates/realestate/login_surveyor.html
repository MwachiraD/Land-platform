{% extends 'base_generic.html' %}

{% block title %}Login as Surveyor{% endblock %}

{% block content %}
  <h2>Login as Surveyor</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
