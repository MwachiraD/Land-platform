{% extends 'base_generic.html' %}

{% block title %}Register as Surveyor{% endblock %}

{% block content %}
  <h2>Register as Surveyor</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}  <!-- Render the form fields here -->
    <button type="submit">Register</button>
  </form>
  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
