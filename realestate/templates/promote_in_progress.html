<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Promotion In Progress</title>
    <script>
        // Automatically refresh after 15 seconds
        setTimeout(function() {
            window.location.href = "{% url 'surveyor_dashboard' %}";
        }, 15000);
    </script>
    <style>
        .spinner {
            margin: 100px auto;
            width: 40px;
            height: 40px;
            border: 5px solid #ccc;
            border-top-color: #1e90ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .text {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="spinner"></div>
<div class="text">
    Promoting your services...<br>Please wait a few seconds.
</div>

</body>
</html>
